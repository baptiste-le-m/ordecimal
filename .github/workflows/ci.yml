name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.73
      # Cargo 1.73 cannot read the committed v4 lockfile: re-resolve with
      # stable cargo, preferring dependency versions that support the MSRV.
      # Seeing rust-version = 1.73, it writes the v3 format 1.73 can read.
      - run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      # After re-resolving, so the cache key follows the MSRV lockfile.
      - uses: Swatinem/rust-cache@v2
      # Library only: dev-dependencies (criterion, proptest) need newer Rust.
      - run: cargo +1.73 check --lib --locked
      - run: cargo +1.73 check --lib --all-features --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz run fuzz_parse -- -max_total_time=30
      - run: cargo +nightly fuzz run fuzz_decode -- -max_total_time=30
      - run: cargo +nightly fuzz run fuzz_roundtrip -- -max_total_time=30
      - run: cargo +nightly fuzz run fuzz_arithmetic -- -max_total_time=30
